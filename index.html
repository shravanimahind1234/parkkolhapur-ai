<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <title>ParkNExplore • Smart Municipal Parking Kolhapur</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#7B2638" />
    <meta name="description" content="ParkNExplore — Smart municipal parking guidance and bay reservation for Kolhapur City, featuring real-time KMC edge node telemetry, Mahalaxmi Temple shuttle passes, and AI occupancy forecasting." />
    <meta property="og:title" content="ParkNExplore • Smart Parking Kolhapur" />
    <meta property="og:description" content="Find parking, check live availability, and reserve your parking space effortlessly across Kolhapur." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/parknexplore-logo-crest.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/images/parknexplore-logo-crest.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#F7F4EE] text-[#292725] antialiased min-h-screen selection:bg-[#C6A15B]/30 selection:text-[#7B2638]">
    <div id="root">
      <div id="initial-loader" style="position:fixed;inset:0;background:linear-gradient(135deg,#FFFDF8 0%,#F7F4EE 50%,#EFECE4 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans',system-ui,sans-serif;z-index:99999;">
        <div style="position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:18px;">
          <div style="position:absolute;width:96px;height:96px;border-radius:24px;border:2px solid rgba(198,161,91,0.35);animation:loaderSpin 3s linear infinite;"></div>
          <svg style="width:72px;height:72px;border-radius:20px;box-shadow:0 10px 25px -5px rgba(123,38,56,0.35);background:linear-gradient(135deg,#8C2B3E,#7B2638,#4F131F);padding:9px;" viewBox="0 0 100 100">
            <defs>
              <linearGradient id="gGold" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFF2D1"/>
                <stop offset="50%" stop-color="#E5C171"/>
                <stop offset="100%" stop-color="#C6A15B"/>
              </linearGradient>
            </defs>
            <path d="M 20 82 C 28 82, 38 78, 48 70 C 60 60, 72 58, 82 62" stroke="url(#gGold)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
            <path d="M 26 22 C 26 19.8 27.8 18 30 18 H 36 C 38.2 18 40 19.8 40 22 V 76 C 40 78.2 38.2 80 36 80 H 30 C 27.8 80 26 78.2 26 76 Z" fill="url(#gGold)"/>
            <path d="M 38 18 C 54 18, 76 22, 76 40 C 76 56, 56 60, 38 60 Z" fill="url(#gGold)"/>
            <path d="M 39 28 C 48 28, 62 30, 62 40 C 62 48, 50 50, 39 50 Z" fill="#7B2638"/>
            <g transform="translate(50, 39)">
              <polygon points="0,-13 2.5,-3 0,0 -2.5,-3" fill="#FFF4D6"/>
              <polygon points="0,13 2.5,3 0,0 -2.5,3" fill="#E5C171"/>
              <polygon points="13,0 3,2.5 0,0 3,-2.5" fill="#FFF4D6"/>
              <polygon points="-13,0 -3,2.5 0,0 -3,-2.5" fill="#E5C171"/>
              <circle cx="0" cy="0" r="2.2" fill="#7B2638"/>
              <circle cx="0" cy="0" r="1.2" fill="#FFFDF8"/>
            </g>
          </svg>
        </div>
        <div style="font-family:'Playfair Display',serif;font-weight:900;font-size:26px;color:#7B2638;letter-spacing:-0.5px;margin-bottom:3px;">
          ParkN<span style="color:#C6A15B;">Explore</span>
        </div>
        <div style="font-size:11px;font-weight:600;color:#5e5954;margin-bottom:16px;">
          Kolhapur Municipal Smart Mobility & Tourism
        </div>
        <div style="width:160px;height:4px;background:#EFECE4;border-radius:99px;overflow:hidden;position:relative;">
          <div style="width:100%;height:100%;background:linear-gradient(90deg,#7B2638,#C6A15B,#7B2638);border-radius:99px;animation:loaderProgress 1.4s ease-in-out infinite;"></div>
        </div>
        <style>
          @keyframes loaderSpin { 100% { transform: rotate(360deg); } }
          @keyframes loaderProgress {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
